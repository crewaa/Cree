[project]
name = "backend"
version = "0.1.0"
description = "FastAPI Modular Monolith Backend"
requires-python = ">=3.11"

dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "pydantic-settings",
  "python-dotenv",

  # Database
  "sqlalchemy>=2.0",
  "greenlet",
  "asyncpg",
  "alembic",
  "psycopg2-binary",

  # Auth & Security
  "python-jose[cryptography]",
  "bcrypt==3.2.2",
  "passlib[bcrypt]==1.7.4",
  "pydantic[email]",

  # OAuth
  "httpx",

  # Utilities
  "loguru",

  # Error tracking (inert unless SENTRY_DSN is set)
  "sentry-sdk[fastapi]",
  "python-dateutil",

  # AI Engine
  "google-genai",

  # Instagram scraping
  "apify-client",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
  "aiosqlite",   # in-memory database for the test suite
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::FutureWarning",
]
